name: resume-optimzer-app
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resume-optimzer-app
      POSTGRES_PASSWORD: resume-optimzer-app
      POSTGRES_DB: resume-optimzer-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume-optimzer-app -d resume-optimzer-app"]
      interval: 2s
      timeout: 5s
      retries: 5
    ports:
      - "6661:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: flat
    ports:
      - "6664:8080"
    depends_on:
      - db

  app:
    image: resume-optimzer-app:local
    profiles:
      - full
    environment:
      DATABASE_URL: postgresql://resume-optimzer-app:resume-optimzer-app@db:5432/resume-optimzer-app
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - "6663:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: